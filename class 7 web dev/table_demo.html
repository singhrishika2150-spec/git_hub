<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        table{
            border: 1px solid lightblue;
        }
        thead{
            background-color: lightgreen;
        }
        td{
            border: 1px solid lightcoral;
        }
    </style>
</head>

<body>
    <h1> Table Tag Demo</h1>
    <h2>Weekly Class Time Table</h2>
    <table class="time table">
        <thead>
            <tr>
               <th>Day</th>
               <th>9:00-10:00</th>
               <th>10:00-11:00</th>
               <th>11:00-12:00</th>
               <th>12:00-01:00</th>



            </tr>
        </thead>
        <tbody>
            <tr>
                <td>MONDAY</td>
                <td>HTML</td>
                <td>CSS</td>
                <td>Javascript</td>
                <td>Lunch</td>
            </tr>
            <tr>
                <td>TUESDAY</td>
                <td>Java</td>
                <td>PC</td>
                <td>Phy</td>
                <td>Lunch</td>
            </tr>
            <tr>
                <td>WEDNESDAY</td>
                <td>Web</td>
                <td>Lab</td>
                <td>Maths</td>
                <td>Lunch</td>
            </tr>
            <tr>
                <td>THURSDAY</td>
                <td>Java</td>
                <td>Web</td>
                <td>Maths</td>
                <td>Lunch</td>
            </tr>
            <tr>
                <td>FRIDAY</td>
                <td>Maths</td>
                <td>PS</td>
                <td>Phy</td>
                <td>Lunch</td>
            </tr>
               
           
        </tbody>
    </table>
    
</body>
</html>
