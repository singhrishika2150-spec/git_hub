<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quiz Creator</title>
    <style>
        body {
            font-family: sans-serif;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 20px;
        }

        h1 {
            color: #941861;
        }

        .input-area {
            display: flex;
            flex-direction: column;
            gap: 8px;
            padding: 16px;
            border: 2px solid #0c0c0c;
            border-radius: 8px;
            margin-bottom: 24px;
        }

        .input-area input {
            padding: 8px;
            border: 1px solid #979393;
            border-radius: 4px;
        }

        #addBtn {
            padding: 10px;
            background-color: #0d2d43;
            color: rgb(240, 234, 234);
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 15px;
        }

        #addBtn:hover {
            background-color: #2980b9;
        }

        .question-card {
            background: #f9f9f9;
            border-left: 4px solid #6b3d3d;
            padding: 12px 16px;
            margin-bottom: 12px;
            border-radius: 6px;
        }

        .question-card h3 {
            margin: 0 0 8px;
        }

        .question-card ul {
            margin: 0 0 8px;
            padding-left: 20px;
        }

        .delete-btn {
            background: #0d4146;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 13px;
        }

        .delete-btn:hover {
            background: #420a04;
        }
    </style>
</head>

<body>
    <h1>📝 Quiz Creator</h1>

    <div class="input-area">
        <input id="questionInput" type="text" placeholder="Enter question">
        <input id="optionA" type="text" placeholder="Option A">
        <input id="optionB" type="text" placeholder="Option B">
        <input id="optionC" type="text" placeholder="Option C">
        <input id="optionD" type="text" placeholder="Option D">
        <button id="addBtn">Add Question</button>
    </div>

    <div id="quizList"></div>

   
</body>

</html>
