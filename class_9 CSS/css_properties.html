<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .first{
            color: darkgoldenrod;
        }
        .hexa{
            color: #2776F5;
        }
        .rgb{
            color: rgb( 231 ,245 ,39 );
        }
        .rgb-opacity{
            color: rgba( 231 ,245 ,39 , 0.5 );
        }
        p{
            font-size: 20px;
            font-weight: 100;
            font-style: italic;
            background-color: darkolivegreen;
            text-decoration: underline;
        }
    </style>
</head>
<body>
    <div>
        <h2 class="first">I am normal color</h2>
        <h2 class="hexa">I am hexaa</h2>
        <h2 class="rgb">I am rgb</h2>
        <h2 class="rgb-opacity">I am rgb-opacity</h2>
    </div>
    <h1>CSS Properties-text and styling</h1>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elite.Explicabo,eligendi?</p>
    <p class="strike">i am strike</p>
</body>
</html>
