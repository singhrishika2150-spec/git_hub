<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=>, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Registration Form </h1>
    <div>
        <label
        for="first-name"
        >First Name:</label>
        <input type="text" id="first-name" placeholder="your first name">
    </div>
    <div>
        <label
        for="last-name"
        >First Name:</label>
        <input type="text" id="last-name" placeholder="your last name">
    </div>
    <div>
        <label
        for="campus">Campus</label>
        <input type="text" readonly value="Sushant University">
    </div>
    <div>
        <label
        for="email"
        >Email:</label>
        <input type="email" placeholder="you@email">
    </div>
    <div>
        <label
        for="password"
        >Password</label>
        <input type="password" placeholder="********">
    </div>
    <div>
        <label for="gender">Gender</label>
        <select id="gender" required>
            <option male>M</option>
            <option Female>F</option>
            <option Other>O</option>
        
        </select>
    </div>
    <div>
        <lable for="age">Age</lable>
        <input type="number" id="age" placeholder="enter your age" min="0" required>
    </div>
    <div>
        <lable for="Profile-pic">Profile Pic</lable>
        <input type="file" id="Profile_pic" required>
    </div>
    <div>
        <button type="submit">Register</button>
    </div>

    
    
    
</body>
</html>
