<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<style>
    .block,
    .inline,
    .inline_block {
        font-weight: bold;
        font-family: sans-serif;
    }


    /* template starts from here */
    .block {
        /* height, width, p,m,border */
        background-color: lightblue;
        padding: 20px;
        height: 20px;
        width: 200px;
        border: 2px solid rgb(71, 103, 23);
        margin: 50px;
    }

    .inline {
        display: inline;
        background-color: lightgreen;
        padding: 20px;
        height:20px;
        width: 200px;
        border: 2px solid rgb(71, 103, 23);
        margin: 5px;
    }

    .inline_block {
        display: inline-block;
        background-color: mediumorchid;  
        padding: 20px;
        height: 20px;
        width: 200px;
        border: 2px solid rgb(71, 103, 23);
        margin: 50px;
        

    }
    .h2{
        color: rgb(133, 18, 97);
        text-decoration: underline;

    }
</style>

<body>
    <h2 class="h2">.HELLO WORLD.</h2>
    <div class="block">How are you?</div>
    <div class="block">What are u doing? </div>
    <div class="inline">What is your goal? </div>
    <div class="inline">I am inline block btw ^^</div>
    <div class="inline_block">And I am inline_block :D</div>


</body>

</html>
<!--
bLock:
1. next element →> new line
2. padding: apply in all directions
3. height: works
4. uwidth : works
5. margin :works
6. border: apply in all directions 


inline:
1. next element →> in same line
2. padding: apply in all directions
3. uheight: not works
4. uwidth : not works
5. margin: only works horizontally
6. border: apply in all directions


 inline-block:
1. next element →> in same line
2. padding: apply in all directions
3. uheight: works
4. uwidth: works
5. margin: works
6. border: apply in all directions



-->
